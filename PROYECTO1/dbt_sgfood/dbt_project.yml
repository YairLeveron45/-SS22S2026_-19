name: 'dbt_sgfood'
version: '1.0.0'
config-version: 2

# El perfil debe coincidir con el nombre en profiles.yml
profile: 'sgfood_profile'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuración de materialización por defecto
models:
  dbt_sgfood:
    staging:
      +materialized: view # Los modelos en staging serán vistas
    marts:
      +materialized: table # Los modelos en marts serán tablas
