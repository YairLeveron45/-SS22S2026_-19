sgfood_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      threads: 1
      # Conexión al Data Warehouse interno de Docker
      host: postgres-dw 
      port: 5432
      user: sgfood_user
      pass: sgfood_password
      dbname: dw_sgfood
      schema: marts # Esquema donde se guardarán los resultados analíticos
